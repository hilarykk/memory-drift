<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Drift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <!-- Stage 1 — intro -->
  <div id="introScreen" class="intro-screen">
    <!-- ambient blob field -->
    <div class="intro-blobs" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
      <div class="blob blob-5"></div>
    </div>
    <!-- light shafts -->
    <div class="intro-shafts" aria-hidden="true">
      <div class="ishaft ishaft-1"></div>
      <div class="ishaft ishaft-2"></div>
      <div class="ishaft ishaft-3"></div>
    </div>
    <!-- vignette -->
    <div class="intro-vignette" aria-hidden="true"></div>
    <!-- content -->
    <div class="intro-content">
      <p class="intro-eyebrow">memory drift</p>
      <button id="recordBtn" class="record-btn record-btn--locked">
        <span class="record-text">Record Your Entry</span>
      </button>
      <div class="record-glow-ring" aria-hidden="true"></div>

      <!-- See memories -->
      <button id="introSeeBtn" class="intro-see-btn" style="display:none">see your memories</button>

      <!-- Auth -->
      <div class="intro-auth" id="introAuth">
        <div id="authLoginView" class="auth-view">
          <input type="text" id="authUsername" class="auth-input" placeholder="choose a username" autocomplete="username" spellcheck="false">
          <div class="auth-actions">
            <button id="authSignInBtn" class="auth-btn">enter</button>
          </div>
          <p id="authMsg" class="auth-msg"></p>
        </div>
        <div id="authUserView" class="auth-view auth-user-view">
          <span id="authWelcome" class="auth-welcome"></span>
          <button id="authSignOutBtn" class="auth-signout-btn">sign out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- World -->
  <canvas id="worldCanvas"></canvas>
  <div id="worldLoading" class="world-loading">loading your memories…</div>

  <!-- Caustic light shafts (CSS animated) -->
  <div id="caustics"></div>

  <!-- UI Overlay -->
  <div id="uiOverlay">
    <header id="siteHeader">
      <h1>Memory Drift</h1>
    </header>
    <p id="worldHint" class="world-hint">click a memory to open it</p>
    <div class="nav-tabs">
      <button id="weeklyTabBtn" class="nav-tab-btn">see your memories</button>
      <button id="moodTabBtn" class="nav-tab-btn">mood</button>
      <button id="mapTabBtn" class="nav-tab-btn">map</button>
      <button id="timelineTabBtn" class="nav-tab-btn">timeline</button>
      <a href="zeitgeist.html" class="nav-tab-btn nav-tab-link">the zeitgeist</a>
    </div>
    <button id="clearBtn" class="clear-all-btn">clear all</button>
    <button id="addBtn" class="add-btn" aria-label="Add a memory">+</button>
  </div>

  <!-- ── FORM MODAL ── -->
  <div id="formModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop js-close-form"></div>
    <div class="modal-sheet">
      <button class="close-btn js-close-form" aria-label="Close">×</button>

      <div class="field-row date-row">
        <label>date &amp; time</label>
        <div class="date-time-wrap">
          <input type="date" id="memoryDate" class="date-input">
          <span class="date-time-sep">·</span>
          <select id="memoryHour" class="time-select"></select>
          <span class="time-colon">:</span>
          <select id="memoryMinute" class="time-select"></select>
          <select id="memoryAmpm" class="time-select time-select--ampm"></select>
        </div>
      </div>

      <div id="questionsWrap"></div>

      <div class="field-row location-row">
        <label>where were you?</label>
        <div class="location-wrap">
          <button type="button" class="locate-btn" id="locateBtn">locate me</button>
          <span class="location-sep">or</span>
          <div class="address-autocomplete">
            <input type="text" class="address-input" id="addressInput" placeholder="start typing an address…" autocomplete="off" spellcheck="false">
            <div id="addressDropdown" class="addr-dropdown" hidden></div>
          </div>
        </div>
        <div class="location-status" id="locationDisplay"></div>
      </div>

      <div class="field-row sound-row">
        <label>record a sound</label>
        <div class="sound-wrap">
          <button type="button" class="sound-btn" id="soundRecordBtn">record</button>
          <div class="sound-playback" id="soundPlayback" style="display:none">
            <button type="button" class="sound-play-btn" id="soundPlayBtn" aria-label="Play">&#9654;</button>
            <div class="sound-waveform" id="soundWaveform"><div class="sound-progress" id="soundProgress"></div></div>
            <button type="button" class="sound-discard-btn" id="soundDiscardBtn">discard</button>
          </div>
        </div>
      </div>

      <div class="field-row images-row">
        <label>add a photo</label>
        <div class="images-wrap">
          <button type="button" class="images-add-btn" id="imagesAddBtn">+ add photo</button>
          <input type="file" id="imagesInput" accept="image/jpeg,image/png,image/webp" style="display:none">
          <div class="images-preview" id="imagesPreview"></div>
        </div>
      </div>

      <div class="field-row">
        <label>how did today feel?</label>
        <div id="moodGrid" class="mood-grid"></div>
      </div>

      <div class="field-row sketch-field">
        <label>leave a 5-minute sketch</label>
        <div class="drawing-wrap">
          <div class="drawing-toolbar">
            <button class="tbtn active" data-tool="brush">brush</button>
            <button class="tbtn" data-tool="pencil">pencil</button>
            <button class="tbtn" data-tool="eraser">erase</button>
            <span class="tb-sep"></span>
            <input type="range" id="brushSize" min="2" max="40" value="10">
            <span class="tb-sep"></span>
            <button class="tbtn" id="undoCanvas">undo</button>
          </div>
          <canvas id="drawingCanvas" width="500" height="340"></canvas>
        </div>
      </div>

      <div class="form-foot">
        <button id="submitBtn" class="submit-btn">release this memory</button>
      </div>
    </div>
  </div>

  <!-- ── WEEKLY OVERLAY PANEL ── -->
  <div id="weeklyPanel" class="weekly-panel" aria-hidden="true">
    <div class="modal-backdrop js-close-weekly"></div>
    <div class="weekly-panel-card">
      <button class="close-btn js-close-weekly" aria-label="Close">×</button>
      <div class="weekly-panel-title">memory overlay</div>
      <div class="weekly-panel-sub">sketches by week</div>
      <div id="weeklyGrid" class="weekly-grid"></div>
    </div>
  </div>

  <!-- ── MOOD PANEL ── -->
  <div id="moodPanel" class="weekly-panel" aria-hidden="true">
    <div class="modal-backdrop js-close-mood"></div>
    <div class="weekly-panel-card">
      <button class="close-btn js-close-mood" aria-label="Close">×</button>
      <div class="weekly-panel-title">by mood</div>
      <div class="weekly-panel-sub">memories grouped by feeling</div>
      <div id="moodFilterBtns" class="mood-filter-row"></div>
      <div id="moodMemGrid" class="week-sketch-grid"></div>
    </div>
  </div>

  <!-- ── MAP PANEL ── -->
  <div id="mapPanel" class="map-panel" aria-hidden="true">
    <div class="modal-backdrop js-close-map"></div>
    <div class="map-panel-card">
      <button class="close-btn js-close-map" aria-label="Close">×</button>
      <div class="map-panel-title">where you've been</div>
      <div class="map-panel-sub">memories with location data</div>
      <div id="mapContainer"></div>
    </div>
  </div>

  <!-- ── TIMELINE PANEL ── -->
  <div id="timelinePanel" class="timeline-panel" aria-hidden="true">
    <div class="modal-backdrop js-close-timeline"></div>
    <div class="timeline-panel-card">
      <button class="close-btn js-close-timeline" aria-label="Close">×</button>
      <div class="timeline-panel-title">your timeline</div>
      <div class="timeline-panel-sub">memories through time</div>
      <div id="timelineContainer" class="timeline-container"></div>
    </div>
  </div>

  <!-- ── MEMORY POPUP ── -->
  <div id="memoryPopup" class="popup" aria-hidden="true">
    <div class="popup-backdrop js-close-popup"></div>
    <div class="popup-card">
      <button class="close-btn js-close-popup" aria-label="Close">×</button>
      <div id="popupBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
