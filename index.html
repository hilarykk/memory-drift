<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Drift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Stage 1 — intro -->
  <div id="introScreen" class="intro-screen">
    <!-- ambient blob field -->
    <div class="intro-blobs" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
      <div class="blob blob-5"></div>
    </div>
    <!-- light shafts -->
    <div class="intro-shafts" aria-hidden="true">
      <div class="ishaft ishaft-1"></div>
      <div class="ishaft ishaft-2"></div>
      <div class="ishaft ishaft-3"></div>
    </div>
    <!-- vignette -->
    <div class="intro-vignette" aria-hidden="true"></div>
    <!-- content -->
    <div class="intro-content">
      <p class="intro-eyebrow">memory drift</p>
      <button id="recordBtn" class="record-btn">
        <span class="record-text">Record Your Entry</span>
      </button>
      <div class="record-glow-ring" aria-hidden="true"></div>
    </div>
  </div>

  <!-- World -->
  <canvas id="worldCanvas"></canvas>

  <!-- Caustic light shafts (CSS animated) -->
  <div id="caustics"></div>

  <!-- UI Overlay -->
  <div id="uiOverlay">
    <header id="siteHeader">
      <h1>Memory Drift</h1>
    </header>
    <p id="worldHint" class="world-hint">click a memory to open it</p>
    <button id="weeklyTabBtn" class="weekly-tab-btn">memory overlay</button>
    <button id="clearBtn" class="clear-all-btn">clear all</button>
    <button id="addBtn" class="add-btn" aria-label="Add a memory">+</button>
  </div>

  <!-- ── FORM MODAL ── -->
  <div id="formModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop js-close-form"></div>
    <div class="modal-sheet">
      <button class="close-btn js-close-form" aria-label="Close">×</button>

      <div class="field-row date-row">
        <label for="memoryDate">date of this memory</label>
        <input type="date" id="memoryDate" class="date-input">
      </div>

      <div id="questionsWrap"></div>

      <div class="field-row">
        <label>how did today feel?</label>
        <div id="moodGrid" class="mood-grid"></div>
      </div>

      <div class="field-row sketch-field">
        <label>leave a sketch</label>
        <div class="drawing-wrap">
          <div class="drawing-toolbar">
            <button class="tbtn active" data-tool="brush">brush</button>
            <button class="tbtn" data-tool="pencil">pencil</button>
            <button class="tbtn" data-tool="eraser">erase</button>
            <span class="tb-sep"></span>
            <input type="color" id="colorPicker" value="#c4a882" title="Color">
            <input type="range" id="brushSize" min="2" max="40" value="10">
            <span class="tb-sep"></span>
            <button class="tbtn" id="clearCanvas">clear</button>
            <button class="tbtn" id="insertBtn">insert</button>
            <input type="file" id="insertInput" accept="image/jpeg,image/png" style="display:none">
          </div>
          <canvas id="drawingCanvas" width="500" height="340"></canvas>
        </div>
      </div>

      <div class="form-foot">
        <button id="submitBtn" class="submit-btn">release this memory</button>
      </div>
    </div>
  </div>

  <!-- ── WEEKLY OVERLAY PANEL ── -->
  <div id="weeklyPanel" class="weekly-panel" aria-hidden="true">
    <div class="modal-backdrop js-close-weekly"></div>
    <div class="weekly-panel-card">
      <button class="close-btn js-close-weekly" aria-label="Close">×</button>
      <div class="weekly-panel-title">memory overlay</div>
      <div class="weekly-panel-sub">a week of drawings, combined</div>
      <div id="weeklyGrid" class="weekly-grid"></div>
    </div>
  </div>

  <!-- ── MEMORY POPUP ── -->
  <div id="memoryPopup" class="popup" aria-hidden="true">
    <div class="popup-backdrop js-close-popup"></div>
    <div class="popup-card">
      <button class="close-btn js-close-popup" aria-label="Close">×</button>
      <div id="popupBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
